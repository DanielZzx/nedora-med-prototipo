<!doctype html>
<!-- ============================================================
     NEDORA MED · Tela principal (front-end)
     Estrutura da página:
       1. Cabeçalho (metadados e carregamento do CSS e do JavaScript)
       2. Tela de login (entrada com nome de usuário)
       3. Área do sistema (menu, cabeçalho e área onde as telas são desenhadas)
     ============================================================ -->
<html lang="pt-BR">
<head>
  <!-- SEÇÃO 1: cabeçalho da página -->
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nedora Med</title>
  <link rel="stylesheet" href="css/estilo.css">
  <!-- type="module" permite usar import/export entre os arquivos JavaScript -->
  <script type="module" src="js/app.js"></script>
</head>
<body>

  <!-- SEÇÃO 2: tela de login (aparece quando não há sessão) -->
  <main id="tela-login" class="tela-login" hidden>
    <form id="formulario-login" class="caixa-login">
      <!-- marca: um símbolo simples (cruz de cuidado) e o nome do sistema -->
      <div class="marca">
        <svg class="marca-icone" viewBox="0 0 32 32" aria-hidden="true">
          <rect width="32" height="32" rx="9" fill="#0e5e6f"/>
          <path d="M16 7.5v17M7.5 16h17" stroke="#f2a65a" stroke-width="4.5" stroke-linecap="round"/>
        </svg>
        <div class="marca-nome">Nedora Med<small>Controle de estoque</small></div>
      </div>

      <h1>Entrar</h1>

      <!-- aviso de erro do login (começa escondido) -->
      <p id="aviso-login" class="aviso aviso-erro" hidden></p>

      <label>Usuário
        <input id="login-usuario" name="usuario" type="text" required autocomplete="username" autocapitalize="none">
      </label>
      <label>Senha
        <input id="login-senha" name="senha" type="password" required autocomplete="current-password">
      </label>

      <button class="botao" type="submit">Entrar</button>
      <!-- o usuário é criado pelo administrador da clínica; não há cadastro público -->
      <p class="nota">Não tem acesso? Peça ao administrador da clínica.</p>
    </form>
  </main>

  <!-- SEÇÃO 3: área do sistema (aparece depois do login) -->
  <div id="area-sistema" class="layout" hidden>

    <!-- SEÇÃO 3.1: menu lateral. Os botões das telas são criados pelo app.js -->
    <nav class="menu">
      <div class="marca">
        <svg class="marca-icone" viewBox="0 0 32 32" aria-hidden="true">
          <rect width="32" height="32" rx="9" fill="#ffffff"/>
          <path d="M16 7.5v17M7.5 16h17" stroke="#0e5e6f" stroke-width="4.5" stroke-linecap="round"/>
        </svg>
        <div class="marca-nome">Nedora Med<small>Estoque clínico</small></div>
      </div>
      <div id="menu-telas"></div>
      <button id="botao-sair" class="item-menu sair" type="button">Sair</button>
    </nav>

    <!-- SEÇÃO 3.2: conteúdo principal -->
    <main class="conteudo">
      <!-- cabeçalho do conteúdo: título da tela e quem está logado -->
      <header class="cabecalho">
        <h1 id="titulo-tela">Painel</h1>
        <span id="usuario-logado" class="chip"></span>
      </header>

      <!-- área onde cada tela é desenhada pelo JavaScript -->
      <section id="area-tela"></section>
    </main>
  </div>

</body>
</html>
